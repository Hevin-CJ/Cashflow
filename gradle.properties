# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle daemon process (4GB heap + parallel GC).
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin daemon dedicated heap configuration
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# Enable parallel and cached builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# AndroidX and Kotlin configuration
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Resource namespacing and R8 optimizations
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
android.enableR8.fullMode=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# KSP2 high performance annotation processing
ksp.allow.all.target.configuration=true
ksp.incremental=true
ksp.useKsp2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
