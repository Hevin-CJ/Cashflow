name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g. v1.1.0)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore and Create keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > cashflow-release.jks
          echo "storeFile=cashflow-release.jks" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK with Version Tag
        run: |
          TAG_NAME=${GITHUB_REF_NAME:-v1.0.0}
          cp app/build/outputs/apk/release/app-release.apk "CashFlow-${TAG_NAME}.apk"

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Generating changelog from recent commits."
            CHANGES=$(git log --pretty=format:"%B" --no-merges -n 20 \
              | sed '/^[[:space:]]*$/d' \
              | sed -E 's/^[-*•][[:space:]]*//' \
              | grep -viE '^(\* )?(v?[0-9]+\.[0-9]+(\.[0-9]+)?(\s*release)?|release\s*v?[0-9]|bump\s+version|prepare\s+release)' \
              | sed 's/^/* /' || echo "")
          else
            echo "Previous tag found: $PREV_TAG"
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"%B" --no-merges \
              | sed '/^[[:space:]]*$/d' \
              | sed -E 's/^[-*•][[:space:]]*//' \
              | grep -viE '^(\* )?(v?[0-9]+\.[0-9]+(\.[0-9]+)?(\s*release)?|release\s*v?[0-9]|bump\s+version|prepare\s+release)' \
              | sed 's/^/* /' || echo "")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="* Bug fixes and performance improvements."
          fi

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo "$CHANGES"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Multi-Version Binary Delta Patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y bsdiff
          mkdir -p patches
          mkdir -p prev_apks
          CURRENT_TAG="${{ github.ref_name }}"
          NEW_APK="CashFlow-${CURRENT_TAG}.apk"

          # Query up to 10 past release tags (excluding current tag)
          PAST_TAGS=$(gh release list --limit 15 --json tagName --jq '.[].tagName' 2>/dev/null | grep -v "^${CURRENT_TAG}$" | head -n 8 || true)
          echo "Previous release tags to generate diffs for:"
          echo "$PAST_TAGS"

          for TAG in $PAST_TAGS; do
            echo "Attempting to generate delta patch: $TAG -> $CURRENT_TAG"
            PREV_DIR="prev_apks/$TAG"
            mkdir -p "$PREV_DIR"
            if gh release download "$TAG" --pattern "*.apk" --dir "$PREV_DIR" 2>/dev/null; then
              PREV_APK=$(find "$PREV_DIR" -name "*.apk" | head -n 1)
              if [ -n "$PREV_APK" ] && [ -f "$PREV_APK" ]; then
                PATCH_NAME="patch-${TAG}-to-${CURRENT_TAG}.patch"
                echo "Creating $PATCH_NAME..."
                bsdiff "$PREV_APK" "$NEW_APK" "patches/$PATCH_NAME"
                echo "Generated $PATCH_NAME ($(stat -c%s "patches/$PATCH_NAME") bytes)"
              fi
            else
              echo "No APK found for tag $TAG, skipping."
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CashFlow ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            CashFlow-*.apk
            patches/*.patch
